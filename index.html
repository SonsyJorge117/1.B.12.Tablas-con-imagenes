<!DOCTYPE html>

<head>

    <title>Ejemplo de tabla avanzada</title>
    <style>
        table {width: 75%;

            border: 3px solid grey;

        th, td {border: 2px solid grey;}
        caption {caption-side: top;
            text-align: center;}

</head>
